$font = UDEV Gothic
$light = UDEV Gothic
# 時計と入力欄を出すモニター。内蔵パネルがあるときはそちら。背景のぼかしは全モニター。
$main = eDP-1

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = screenshot
    # theme:bg
    color = rgba(12, 11, 10, 1)
    blur_passes = 3
    blur_size = 10
    brightness = 0.45
    contrast = 1.1
    vibrancy = 0.15
    noise = 0.02
}

label {
    monitor = $main
    text = $TIME
    font_size = 84
    # theme:text
    color = rgba(244, 240, 232, 1)
    font_family = $light
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor = $main
    text = cmd[update:60000] LC_TIME=ja_JP.UTF-8 date +"%-m月%-d日 %A"
    font_size = 15
    # theme:text2
    color = rgba(163, 158, 148, 1)
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor = $main
    size = 300, 44
    outline_thickness = 1
    # theme:inner
    inner_color = rgba(12, 11, 10, 0.88)
    # theme:outer
    outer_color = rgba(230, 225, 214, 0.2)
    # theme:check
    check_color = rgba(244, 240, 232, 0.45)
    # theme:fail
    fail_color = rgba(196, 122, 106, 0.9)
    # theme:font
    font_color = rgb(244, 240, 232)
    fade_on_empty = false
    rounding = 0
    font_family = $font
    # theme:placeholder
    placeholder_text = <span foreground="##6f6a64">パスワード</span>
    # theme:failtext
    fail_text = <span foreground="##c47a6a">違います</span>
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = 0
    position = 0, -40
    halign = center
    valign = center
}
